<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{%TITLE%}}</title>
  <meta name="description" content="{{%DESCRIPTION%}}">
  <link rel="canonical" href="{{%URL%}}">
  <link rel="icon" href="/favicon.ico">
  {{%FEED_LINKS%}}
  {{%EXTRA_HEAD%}}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  {{%ANALYTICS%}}
</head>
<body class="{{%BODY_CLASS%}}">
  {{%NAV%}}
  <main id="main" class="landing-main">
    <div class="landing-intro">
      <p class="landing-kicker">Welcome</p>
      <h1>{{%NAME%}}</h1>
      <p class="landing-tagline">{{%TAGLINE%}}</p>
    </div>
    <div class="path-grid">
      <a class="path-card path-web" href="/web/">
        <p class="path-kicker">Section</p>
        <h2>Web development</h2>
        <p>Talks, posts, and notes on frontend engineering.</p>
        <span class="path-cta">Enter</span>
      </a>
      <a class="path-card path-personal" href="/personal/">
        <p class="path-kicker">Section</p>
        <h2>Personal</h2>
        <p>Everything else — notes, photos, and life outside the editor.</p>
        <span class="path-cta">Enter</span>
      </a>
    </div>
  </main>
  {{%FOOTER%}}
  <script type="module" src="/assets/js/main.js"></script>
</body>
</html>
